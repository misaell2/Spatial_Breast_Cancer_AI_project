name: spatial-bc-ai

channels:
  - conda-forge

dependencies:
  # Core Python
  - python=3.11
  - pip

  # Spatial transcriptomics / single-cell ecosystem
  - scanpy
  - squidpy
  - anndata
  - leidenalg
  - python-igraph
  - umap-learn

  # Data science
  - pandas
  - numpy
  - scipy
  - scikit-learn
  - h5py
  - joblib

  # Plotting and image support
  - matplotlib
  - seaborn
  - pillow
  - scikit-image

  # Optional but useful for notebooks/debugging
  - jupyterlab
  - ipykernel
